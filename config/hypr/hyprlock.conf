# ── hyprlock ─────────────────────────────────────────────────────────────────

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

# ── Background ────────────────────────────────────────────────────────────────
background {
    monitor  =
    path     = $HOME/.local/share/cyrodiil/wallpapers/autumns.hues.png
    blur_passes = 2
    blur_size   = 3
    brightness  = 0.75
    contrast    = 0.9
    vibrancy    = 0.1
}

# ── Clock ─────────────────────────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "$(date +'%H:%M')"
    color    = rgba(d4c5b0ff)
    font_size   = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign   = center
    valign   = center
}

label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color    = rgba(b0a090cc)
    font_size   = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign   = center
    valign   = center
}

# ── Quote ─────────────────────────────────────────────────────────────────────
label {
    monitor  =
    text     = Discipline or Regret
    color    = rgba(b0a090cc)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign   = center
    valign   = center
}

# ── Input field ───────────────────────────────────────────────────────────────
input-field {
    monitor  =
    size     = 360, 60
    position = 0, -160
    halign   = center
    valign   = center

    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.2
    dots_center       = true

    outer_color       = rgba(3d2a1aaa)
    inner_color       = rgba(221a12cc)
    font_color        = rgba(d4c5b0ff)
    fade_on_empty     = true
    placeholder_text  = <span foreground="##9a8a7a">󰌾  password</span>

    check_color  = rgba(c4845aff)
    fail_color   = rgba(c45040ff)
    fail_text    = <span foreground="##c45040">$FAIL ($ATTEMPTS)</span>

    capslock_color = rgba(c4904fff)

    rounding = 10
}

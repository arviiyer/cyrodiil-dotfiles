# ── hypridle ─────────────────────────────────────────────────────────────────

general {
    lock_cmd = pgrep -u "$(id -u)" -x hyprlock || hyprlock
    before_sleep_cmd = pgrep -u "$(id -u)" -x hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: dim screen
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/screen-brightness.sh dim
    on-resume  = ~/.config/hypr/scripts/screen-brightness.sh restore
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = pgrep -u "$(id -u)" -x hyprlock || hyprlock
    on-resume  = hyprctl dispatch dpms on
}

# 12 min: turn off display
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
